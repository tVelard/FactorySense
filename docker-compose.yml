services:
  telemetry-db:
    image: influxdb:2.7
    restart: unless-stopped
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_PASSWORD:?}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG:?}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET:?}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN:?}
    volumes:
      - telemetry-db-data:/var/lib/influxdb2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  alerts-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes:
      - alerts-db-data:/var/lib/postgresql/data
      - ./alerts-db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      INFLUX_URL: http://telemetry-db:8086
      INFLUX_TOKEN: ${INFLUX_TOKEN:?}
      INFLUX_ORG: ${INFLUX_ORG:?}
      INFLUX_BUCKET: ${INFLUX_BUCKET:?}
      DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@alerts-db:5432/${POSTGRES_DB:?}
      SENSOR_API_KEY: ${SENSOR_API_KEY:?}
    depends_on:
      telemetry-db:
        condition: service_healthy
      alerts-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  sensor-simulator:
    build: ./sensor-simulator
    restart: unless-stopped
    environment:
      BACKEND_URL: http://load-balancer:8000/telemetry
      INTERVAL_SECONDS: "3"
      MACHINE_COUNT: "3"
      SENSOR_API_KEY: ${SENSOR_API_KEY:?}
    depends_on:
      backend:
        condition: service_healthy
      load-balancer:
        condition: service_started

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://load-balancer:8000
      BACKEND_WS_URL: ws://load-balancer:8000/ws/alerts
      PORT: "3000"
    depends_on:
      backend:
        condition: service_healthy

  load-balancer:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./load-balancer/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    ports:
      - "3000:3000"
      - "127.0.0.1:8000:8000"

volumes:
  telemetry-db-data:
  alerts-db-data:
