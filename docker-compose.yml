services:
  influxdb:
    image: influxdb:2.7
    restart: unless-stopped
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_PASSWORD:?INFLUX_PASSWORD manquant, faire cp .env.example .env}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG:?INFLUX_ORG manquant, faire cp .env.example .env}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET:?INFLUX_BUCKET manquant, faire cp .env.example .env}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN:?INFLUX_TOKEN manquant, faire cp .env.example .env}
    volumes:
      - influxdb-data:/var/lib/influxdb2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER manquant, faire cp .env.example .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant, faire cp .env.example .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB manquant, faire cp .env.example .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"  # tests backend uniquement

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      INFLUX_URL: http://influxdb:8086
      INFLUX_TOKEN: ${INFLUX_TOKEN:?INFLUX_TOKEN manquant, faire cp .env.example .env}
      INFLUX_ORG: ${INFLUX_ORG:?INFLUX_ORG manquant, faire cp .env.example .env}
      INFLUX_BUCKET: ${INFLUX_BUCKET:?INFLUX_BUCKET manquant, faire cp .env.example .env}
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER manquant, faire cp .env.example .env}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant, faire cp .env.example .env}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB manquant, faire cp .env.example .env}
      SENSOR_API_KEY: ${SENSOR_API_KEY:?SENSOR_API_KEY manquant, faire cp .env.example .env}
    depends_on:
      influxdb:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  sensor-simulator:
    build: ./sensor-simulator
    restart: unless-stopped
    environment:
      BACKEND_URL: http://lb:8000/telemetry
      INTERVAL_SECONDS: "3"
      MACHINE_COUNT: "3"
      SENSOR_API_KEY: ${SENSOR_API_KEY:?SENSOR_API_KEY manquant, faire cp .env.example .env}
    depends_on:
      backend:
        condition: service_healthy
      lb:
        condition: service_started

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://lb:8000
      BACKEND_WS_URL: ws://lb:8000/ws/alerts
      PORT: "3000"
    depends_on:
      backend:
        condition: service_healthy

  lb:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./lb/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    ports:
      - "3000:3000"
      - "127.0.0.1:8000:8000"  # API : tests et débogage en local

volumes:
  influxdb-data:
  postgres-data:
