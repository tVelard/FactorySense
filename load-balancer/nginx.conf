# Load balancer in front of the stateless services (backend, frontend).
# Service names are resolved at request time through Docker's DNS, which returns
# one address per replica: `docker compose up --scale` is picked up within 5 s,
# without restarting nginx. A replica that refuses the connection (starting,
# stopping) is skipped and the request retried on the next one.
resolver 127.0.0.11 valid=5s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
proxy_next_upstream error timeout http_502 http_503;
# WebSockets stay open while idle (alerts are rare).
proxy_read_timeout 1d;
proxy_send_timeout 1d;

server {
    listen 8000;
    location / {
        set $backend backend;
        proxy_pass http://$backend:8000;
        # Shows which replica served the request (scalability demo).
        add_header X-Upstream $upstream_addr always;
    }
}

server {
    listen 3000;
    location / {
        set $frontend frontend;
        proxy_pass http://$frontend:3000;
    }
}
